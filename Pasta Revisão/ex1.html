<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade de Signos</title>
</head>
<body>
    <h1>Descubra seu Signo</h1>

    Digite seu mês entre 1 - 12: <input type="number" id="signo" min="1" max="12">
    <button onclick="exibirSignos()">Ver Signos</button>
    <p id="resultado"></p>

    <script>
        function exibirSignos() {
            let mes = parseInt(document.getElementById("signo").value);
            let resultado;

            switch (mes) {
                case 1:
                    resultado = "Capricórnio ou Aquário";
                    break;
                case 2:
                    resultado = "Aquário ou Peixes";
                    break;
                default:
                    resultado = "Mês inválido";
            }

            document.getElementById("resultado").innerHTML = 
                `O mês selecionado foi ${mes} e seu signo é ${resultado}`;
        }
    </script>
</body>
</html>
